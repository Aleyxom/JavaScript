<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body{
            background-color: rgb(105, 183, 255);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Aprendendo DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar <strong>DOM</strong> em Javascript</p>
    <div id="msg">Clique em mim</div>
    
    <script>
        var corpo = window.document.body
        var p1 = window.document.getElementsByTagName("p")[0] //primeiro <p> que aparecer
        var p2 = window.document.getElementsByTagName("p")[1]
        p1.style.color = 'yellow'
        corpo.style.backgroundColor = "Blue"
        window.document.write("Está escrito assim: " + p1.innerText) //texto dentro do p
        window.document.write("<br/>")
        window.document.write(p2.innerHTML) // pega o texto com as tags

        var msg = window.document.getElementById("msg")
        msg.style.backgroundColor = "green"
        msg.innerText = "Olá mundo!"

        var d = window.document.querySelector("div#msg")
        d.style.backgroundColor = "red"
    </script>
</body>
</html>
